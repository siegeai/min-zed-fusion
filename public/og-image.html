<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>min. OG card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Source for public/og-cover-minion-v2.png, the card every chat and social preview
     renders. Rebuild with: node generate-og-image.js
     Mirrors the landing hero on purpose: the card should show the mechanic (a
     name that is an email address), because that is the only thing a visitor
     has to understand before copying it onto an invite. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

  .og {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: #FAFAF9; color: #0A0A0A;
    padding: 64px 76px; display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .og::after {
    content: ""; position: absolute; top: -230px; right: -140px;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(16,185,129,0.12) 0%, rgba(16,185,129,0) 68%);
  }
  .og > * { position: relative; z-index: 1; }

  .mark {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 34px; font-weight: 700; letter-spacing: -0.02em;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 54px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05;
  }
  .sub { margin-top: 16px; font-size: 22px; line-height: 1.5; color: #6B7280; }

  .name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 96px; font-weight: 600; letter-spacing: -0.045em; line-height: 1;
  }
  .addr {
    margin-top: 12px;
    font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
    font-size: 26px; color: #6B7280; letter-spacing: -0.01em;
  }

  .foot {
    margin-top: auto;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(0,0,0,0.08); padding-top: 22px;
    font-size: 19px; color: #9CA3AF;
  }
  .foot .site { font-weight: 600; color: #6B7280; }
</style>
</head>
<body>
  <div class="og">
    <div>
      <div class="mark">min.</div>
      <h1 style="margin-top:38px;">Meet your team's newest member.</h1>
      <p class="sub">They sit in your meetings, docs, and only answer to your team.</p>
    </div>

    <div style="margin-top:52px;">
      <div class="name">Juno</div>
      <div class="addr">juno@getmin.ai</div>
    </div>

    <div class="foot">
      <span class="site">getmin.ai</span>
      <span>Nothing to install, no account.</span>
    </div>
  </div>
</body>
</html>
